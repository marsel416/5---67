<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5Б-Банк</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      min-height: 100vh;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 28px;
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      text-align: center;
      opacity: 0.7;
      margin-bottom: 25px;
      font-size: 14px;
    }
    input, select, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      font-size: 16px;
    }
    input, select {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    input::placeholder { color: rgba(255,255,255,0.5); }
    button {
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s;
    }
    button:hover { transform: scale(1.02); }
    button.secondary {
      background: rgba(255,255,255,0.15);
    }
    .card-info {
      background: rgba(0,210,255,0.15);
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
    }
    .balance {
      font-size: 36px;
      font-weight: 700;
      margin: 10px 0;
    }
    .history {
      margin-top: 25px;
      max-height: 220px;
      overflow-y: auto;
    }
    .history-item {
      background: rgba(255,255,255,0.07);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }
    .hidden { display: none !important; }
    .admin-panel {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.15);
    }
    .error {
      color: #ff6b6b;
      text-align: center;
      margin: 10px 0;
      font-size: 14px;
    }
    .success {
      color: #51cf66;
      text-align: center;
      margin: 10px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="login-screen">
      <h1>5Б-Банк</h1>
      <p class="subtitle">Введите персональный код карты</p>
      <input type="text" id="code-input" placeholder="Код карты (например 1001)" maxlength="6" autofocus>
      <button id="login-btn">Войти</button>
      <p id="login-error" class="error hidden"></p>
    </div>

    <div id="user-screen" class="hidden">
      <h1>Личный кабинет</h1>
      <div class="card-info">
        <div>Карта № <strong id="card-number"></strong></div>
        <div class="balance" id="balance">0 ₽</div>
        <div style="opacity:0.7;font-size:14px">Доступно</div>
      </div>
      <div class="history">
        <h3 style="margin-bottom:12px">История операций</h3>
        <div id="history-list"></div>
      </div>
      <button class="secondary" id="logout-user">Выйти</button>
    </div>

    <div id="admin-screen" class="hidden">
      <h1>Админ-панель</h1>
      <p class="subtitle">Начисление денег</p>
      <select id="admin-card">
        <option value="">Выберите карту</option>
      </select>
      <input type="number" id="admin-amount" placeholder="Сумма (₽)" min="1">
      <input type="text" id="admin-comment" placeholder="Комментарий (необязательно)">
      <button id="add-money-btn">Начислить</button>
      <p id="admin-msg" class="hidden"></p>
      <div class="admin-panel">
        <h3 style="margin-bottom:12px">Все карты</h3>
        <div id="all-cards"></div>
      </div>
      <button class="secondary" id="logout-admin">Выйти</button>
    </div>
  </div>

  <script>
    const ADMIN_CODE = "5555";
    const CARDS = {
      "1001": { name: "Карта 1", balance: 0, history: [] },
      "1002": { name: "Карта 2", balance: 0, history: [] },
      "1003": { name: "Карта 3", balance: 0, history: [] },
      "1004": { name: "Карта 4", balance: 0, history: [] },
      "1005": { name: "Карта 5", balance: 0, history: [] },
      "1006": { name: "Карта 6", balance: 0, history: [] },
      "1007": { name: "Карта 7", balance: 0, history: [] },
      "1008": { name: "Карта 8", balance: 0, history: [] },
      "1009": { name: "Карта 9", balance: 0, history: [] },
      "1010": { name: "Карта 10", balance: 0, history: [] },
      "1011": { name: "Карта 11", balance: 0, history: [] },
      "1012": { name: "Карта 12", balance: 0, history: [] },
      "1013": { name: "Карта 13", balance: 0, history: [] },
      "1014": { name: "Карта 14", balance: 0, history: [] },
      "1015": { name: "Карта 15", balance: 0, history: [] }
    };

    function loadData() {
      try {
        const saved = localStorage.getItem("5b_bank");
        if (saved) {
          const data = JSON.parse(saved);
          for (let code in data) {
            if (CARDS[code]) CARDS[code] = data[code];
          }
        }
      } catch (e) { console.error(e); }
    }

    function saveData() {
      try {
        localStorage.setItem("5b_bank", JSON.stringify(CARDS));
      } catch (e) { console.error(e); }
    }

    loadData();
    let currentUser = null;

    function login() {
      const code = (document.getElementById("code-input").value || "").trim();
      const error = document.getElementById("login-error");

      if (!code) {
        error.textContent = "Введите код";
        error.classList.remove("hidden");
        return;
      }

      if (code === ADMIN_CODE) {
        currentUser = "admin";
        showAdmin();
        return;
      }

      if (CARDS[code]) {
        currentUser = code;
        showUser();
      } else {
        error.textContent = "Неверный код. Попробуй 1001–1015 или 5555";
        error.classList.remove("hidden");
      }
    }

    function logout() {
      currentUser = null;
      document.getElementById("login-screen").classList.remove("hidden");
      document.getElementById("user-screen").classList.add("hidden");
      document.getElementById("admin-screen").classList.add("hidden");
      document.getElementById("code-input").value = "";
      document.getElementById("login-error").classList.add("hidden");
      document.getElementById("code-input").focus();
    }

    function showUser() {
      const card = CARDS[currentUser];
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("user-screen").classList.remove("hidden");
      document.getElementById("admin-screen").classList.add("hidden");

      document.getElementById("card-number").textContent = currentUser;
      document.getElementById("balance").textContent = card.balance + " ₽";

      const list = document.getElementById("history-list");
      list.innerHTML = "";
      if (card.history.length === 0) {
        list.innerHTML = "<p style='opacity:0.6;text-align:center'>Пока нет операций</p>";
      } else {
        card.history.slice().reverse().forEach(item => {
          const div = document.createElement("div");
          div.className = "history-item";
          div.innerHTML = `
            <span>\( {item.date}<br><small style="opacity:0.7"> \){item.comment || "Пополнение"}</small></span>
            <strong style="color:#51cf66">+${item.amount} ₽</strong>
          `;
          list.appendChild(div);
        });
      }
    }

    function showAdmin() {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("user-screen").classList.add("hidden");
      document.getElementById("admin-screen").classList.remove("hidden");

      const select = document.getElementById("admin-card");
      select.innerHTML = '<option value="">Выберите карту</option>';
      for (let code in CARDS) {
        const opt = document.createElement("option");
        opt.value = code;
        opt.textContent = `Карта ${code} — ${CARDS[code].balance} ₽`;
        select.appendChild(opt);
      }

      const all = document.getElementById("all-cards");
      all.innerHTML = "";
      for (let code in CARDS) {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `<span>Карта \( {code}</span><strong> \){CARDS[code].balance} ₽</strong>`;
        all.appendChild(div);
      }
    }

    function addMoney() {
      const code = document.getElementById("admin-card").value;
      const amount = parseInt(document.getElementById("admin-amount").value);
      const comment = document.getElementById("admin-comment").value.trim() || "Пополнение от учителя";
      const msg = document.getElementById("admin-msg");

      if (!code || !amount || amount <= 0) {
        msg.textContent = "Выберите карту и введите сумму";
        msg.className = "error";
        msg.classList.remove("hidden");
        return;
      }

      CARDS[code].balance += amount;
      CARDS[code].history.push({
        amount: amount,
        comment: comment,
        date: new Date().toLocaleString("ru-RU")
      });
      saveData();

      msg.textContent = `Начислено ${amount} ₽ на карту ${code}`;
      msg.className = "success";
      msg.classList.remove("hidden");

      document.getElementById("admin-amount").value = "";
      document.getElementById("admin-comment").value = "";
      showAdmin();
    }

    document.getElementById("login-btn").addEventListener("click", login);
    document.getElementById("logout-user").addEventListener("click", logout);
    document.getElementById("logout-admin").addEventListener("click", logout);
    document.getElementById("add-money-btn").addEventListener("click", addMoney);

    document.getElementById("code-input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") login();
    });

    document.getElementById("code-input").focus();
  </script>
</body>
</html>
